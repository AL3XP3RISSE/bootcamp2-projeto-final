# =============================================================
# RAIZ DO NOME · configuração do Nginx
# Substitui o default.conf da imagem nginx:alpine
# =============================================================

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # ========== Compressão ==========
  # Reduz o tamanho de HTML, CSS e JS enviados ao navegador
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml;

  # ========== Cabeçalhos de segurança ==========
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ========== Cache ==========
  # CSS e JS ficam 1 hora no navegador. Curto de propósito:
  # os arquivos não têm hash no nome, então uma versão nova
  # precisa chegar rápido a quem já abriu o app.
  location ~* \.(css|js)$ {
    expires 1h;
  }

  # ========== Páginas ==========
  location / {
    try_files $uri $uri/ =404;
  }
}