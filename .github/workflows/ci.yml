# =============================================================
# RAIZ DO NOME · integração contínua
# Confere a sintaxe dos arquivos JS e roda os testes do Vitest
# em todo PR para a main.
# O job se chama "testes": é esse o nome do status check
# que fica obrigatório na proteção da main.
# =============================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      # ========== Código e ambiente ==========
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ========== Dependências e testes ==========
      - name: Instalar dependências
        run: npm ci

      # Os testes só importam o utils.js. Esta etapa pega erros de
      # sintaxe no script.js (ex.: import duplicado), que quebram o app
      # no navegador sem derrubar nenhum teste
      - name: Conferir sintaxe do JavaScript
        run: |
          for arquivo in script.js utils.js; do
            node --check "$arquivo"
          done

      - name: Rodar testes
        run: npm test
